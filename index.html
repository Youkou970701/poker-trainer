<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poker Trainer</title>
<style>
:root{--bg:#0f1a14;--card:#182820;--fg:#e8f0ea;--mute:#8aa394;--ok:#4cc38a;--bad:#e5645c;--acc:#e0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
#languages{display:flex;justify-content:flex-end;gap:6px}
#languages button{flex:0 1 auto;font-size:13px;padding:5px 10px}
nav button,#languages button{flex:1;padding:10px 6px;border:1px solid #2c4436;background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;font-size:14px}
nav button.on,#languages button[aria-pressed=true]{background:var(--acc);color:#1a1405;border-color:var(--acc)}
.card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:12px}
.q{font-size:18px;margin:0 0 14px}
.hand{font-size:44px;text-align:center;letter-spacing:6px;margin:8px 0}
.red{color:#ef6b6b}
.meta{color:var(--mute);font-size:14px;text-align:center;margin-bottom:12px}
.row{display:flex;gap:10px}
.row button,.go{flex:1;padding:14px;font-size:17px;border:0;border-radius:10px;cursor:pointer;background:#2c4436;color:var(--fg)}
.row button:hover,.go:hover{background:#3a5a47}
input[type=number]{width:100%;padding:12px;font-size:18px;border-radius:8px;border:1px solid #2c4436;background:#0f1a14;color:var(--fg);margin-bottom:10px}
.fb{margin-top:14px;padding:12px;border-radius:8px;font-size:15px}
.fb.ok{background:#1d3d2d;border:1px solid var(--ok)}
.fb.bad{background:#40211f;border:1px solid var(--bad)}
.next{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#1a1405;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;margin-top:10px;font-size:9px}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#22352b;color:var(--mute);border-radius:2px}
.grid{grid-template-columns:repeat(13,minmax(0,1fr))}
.grid div{overflow:hidden;min-width:0}
.grid.big{font-size:clamp(7px,2.4vw,11px);gap:2px}
.grid.big div{cursor:pointer;border-radius:3px;font-weight:600}
.grid .in{background:#2d7a55;color:#fff}
.grid .cur{outline:2px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #2c4436}
.note{color:var(--mute);font-size:13px;margin-top:16px}
.hide{display:none}
</style>
</head>
<body>
<main>
<div id="languages"></div>
<h1 id="heading"></h1>
<nav id="nav"></nav>
<div id="view"></div>
<p class="note" id="note"></p>
</main>

const RANKS='AKQJT98765432';
const SUITS=['♠','♥','♦','♣'];
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const $=id=>document.getElementById(id);

let stats={};
try{stats=JSON.parse(localStorage.getItem('pokerStats')||'{}')}catch(e){}
function rec(mod,ok,info){
  const s=stats[mod]=stats[mod]||{n:0,c:0,miss:[]};
  s.n++; if(ok)s.c++; else{s.miss.unshift(info);s.miss=s.miss.slice(0,15)}
  try{localStorage.setItem('pokerStats',JSON.stringify(stats))}catch(e){}
}


function label(r1,r2,suited){
  if(r1===r2)return RANKS[r1]+RANKS[r2];
  const hi=Math.min(r1,r2),lo=Math.max(r1,r2);
  return RANKS[hi]+RANKS[lo]+(suited?'s':'o');
}
function parseRange(str){
  const set=new Set();
  str.split(/[\s,]+/).filter(Boolean).forEach(t=>{
    const plus=t.endsWith('+'); if(plus)t=t.slice(0,-1);
    const a=RANKS.indexOf(t[0]),b=RANKS.indexOf(t[1]),k=t[2];
    if(a===b){
      for(let i=plus?0:a;i<=a;i++)set.add(RANKS[i]+RANKS[i]);
      if(!plus)set.add(t.slice(0,2));
    }else{
      const end=plus?a+1:b;
      for(let i=b;i>=end;i--)set.add(RANKS[a]+RANKS[i]+k);
    }
  });
  return set;
}
const RFI={
  'UTG':'66+ A3s+ ATo+ KTs+ KQo QTs+ JTs T9s 98s 87s 76s',
  'HJ':'44+ A2s+ ATo+ KTs+ KJo+ QTs+ QJo JTs T9s 98s 87s 76s 65s',
  'CO':'22+ A2s+ A9o+ K8s+ KTo+ Q9s+ QTo+ J9s+ JTo T9s 98s 87s 76s 65s 54s',
  'BTN':'22+ A2s+ A2o+ K2s+ K8o+ Q4s+ Q9o+ J6s+ J9o+ T6s+ T9o 96s+ 98o 85s+ 87o 75s+ 64s+ 54s 53s 43s',
  'SB':'22+ A2s+ A3o+ K3s+ K9o+ Q6s+ QTo+ J7s+ J9o+ T7s+ T9o 97s+ 87s 86s 76s 75s 65s 64s 54s'
};
const RFI_SET={};for(const p in RFI)RFI_SET[p]=parseRange(RFI[p]);
const ALL=[];
for(let i=0;i<13;i++)for(let j=0;j<13;j++)ALL.push({i,j,l:i===j?RANKS[i]+RANKS[i]:i<j?RANKS[i]+RANKS[j]+'s':RANKS[j]+RANKS[i]+'o'});


function dealHand(){
  const r1=rnd(13),r2=rnd(13);
  const suited=r1!==r2&&Math.random()<0.5;
  const s1=rnd(4);
  let s2=suited?s1:(r1===r2?(s1+1+rnd(3))%4:(s1+1+rnd(3))%4);
  return {r1,r2,suited,l:label(r1,r2,suited),s1,s2};
}
function handHTML(h){
  const c=(r,s)=>`<span class="${s===1||s===2?'red':''}">${RANKS[r]}${SUITS[s]}</span>`;
  const a=Math.min(h.r1,h.r2)===h.r1?[h.r1,h.s1,h.r2,h.s2]:[h.r2,h.s2,h.r1,h.s1];
  return c(a[0],a[1])+' '+c(a[2],a[3]);
}
function gridHTML(set,cur){
  return '<div class="grid">'+ALL.map(x=>`<div class="${set.has(x.l)?'in':''} ${x.l===cur?'cur':''}">${x.l}</div>`).join('')+'</div>';
}


function chen(i,j,suited){
  const v=k=>[10,8,7,6][k]??(RANKS.length-k+1)/2;
  const val=r=>r<4?[10,8,7,6][r]:(13-r+1)/2;
  let hi=Math.min(i,j),lo=Math.max(i,j),s=val(hi);
  if(i===j)return Math.max(5,s*2);
  if(suited)s+=2;
  const gap=lo-hi-1;
  s-= gap===0?0:gap===1?1:gap===2?2:gap===3?4:5;
  if(gap<=1&&lo>=3)s+=1;
  return Math.ceil(s);
}
const RANKED=(()=>{
  const list=ALL.map(x=>({l:x.l,score:chen(x.i,x.j,x.i<x.j)+(x.i===x.j?0.1*(12-x.i)/12:0)+(x.i<x.j?0.01:0)-0.001*(x.i+x.j),w:x.i===x.j?6:x.i<x.j?4:12}));
  list.sort((a,b)=>b.score-a.score);
  let acc=0;list.forEach(x=>{acc+=x.w;x.pct=acc/1326*100});
  return Object.fromEntries(list.map(x=>[x.l,x.pct]));
})();

function defaultLanguage(value){return /^zh/i.test(value)?'zh-CN':/^ja/i.test(value)?'ja':'en'}
let lang=defaultLanguage(navigator.language);
try{const saved=localStorage.getItem('pokerLang');if(Object.hasOwn(I18N,saved))lang=saved}catch(e){}
function tr(key,values={}){return I18N[lang][key].replace(/\{(\w+)\}/g,(_,k)=>String(values[k]??''))}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function migrateTermScores(scores){
  const migrated={...scores};
  for(const term of TERMS['zh-CN']){
    if(term.name!==term.id&&Object.hasOwn(migrated,term.name)){
      const old=migrated[term.name];
      migrated[term.id]=Math.max(Number(migrated[term.id])||0,Number(old)||0);
      delete migrated[term.name];
    }
  }
  return migrated;
}
let tScore={};
try{const stored=JSON.parse(localStorage.getItem('pokerTerms')||'{}');tScore=migrateTermScores(stored);if(JSON.stringify(stored)!==JSON.stringify(tScore))localStorage.setItem('pokerTerms',JSON.stringify(tScore))}catch(e){}
const mods={};
let cur='terms',state={};
function mathText(data){
  const {type,P,B,o,flop,ans}=data;
  const values={P,B,o,ans:ans.toFixed(1),total:type==='odds'?P+2*B:P+B,street:tr(flop?'flop':'turn'),factor:flop?4:2,approx:o*(flop?4:2)};
  return {q:tr(type+'Q',values),expl:tr(type+'E',values)};
}
function mistakeText(info){
  if(typeof info==='string')return esc(info);
  if(!info||typeof info!=='object')return '';
  if(info.mod==='terms')return esc(TERMS[lang].find(t=>t.id===info.termId)?.name||info.termId);
  if(info.mod==='math')return esc(tr('mathMiss',{question:mathText(info).q,ans:info.ans.toFixed(1)}));
  if(info.mod==='rfi')return esc(tr('rfiMiss',{...info,action:tr(info.raise?'raise':'fold')}));
  if(info.mod==='push')return esc(tr('pushMiss',{...info,action:tr(info.push?'allin':'fold')}));
  return '';
}
mods.math={render(){
  const type=pick(['odds','odds','outs','mdf']),P=pick([30,40,60,80,100,120,150,200]),b=pick([[1,3],[1,2],[2,3],[3,4],[1,1],[3,2]]),B=Math.round(P*b[0]/b[1]);
  let ans,tol,o,flop;
  if(type==='odds'){ans=B/(P+2*B)*100;tol=2}
  else if(type==='outs'){o=pick([4,6,8,9,12,15]);flop=Math.random()<0.6;ans=flop?(1-(47-o)/47*(46-o)/46)*100:o/46*100;tol=3}
  else{ans=P/(P+B)*100;tol=2}
  state={mod:'math',type,P,B,o,flop,ans,tol};
  return `<div class="card"><p class="q">${mathText(state).q}</p><input type="number" id="in" placeholder="${tr('placeholder')}" autofocus><button class="go" id="ok">${tr('submit')}</button><div id="fb"></div></div>`;
},bind(){
  const submit=()=>{const v=parseFloat($('in').value);if(isNaN(v)||state.answered)return;state.answered=true;const ok=Math.abs(v-state.ans)<=state.tol;rec('math',ok,{...state});
    $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${tr(ok?'correct':'wrong')} (${tr('tolerance',state)})<br>${mathText(state).expl}</div>${nextButton('nextQ')}`;
    $('ok').classList.add('hide');bindNext()};
  $('ok').onclick=submit;$('in').onkeydown=e=>{if(e.key==='Enter')submit()};
}};
function nextButton(key){return `<button class="next" id="nx">${tr(key)}</button>`}
function bindNext(){$('nx').onclick=()=>show();$('nx').focus()}
function rangePct(set){let w=0;set.forEach(l=>{w+=l.length===2?6:l[2]==='s'?4:12});return w/1326*100}
mods.rfi={render(){
  const pos=pick(Object.keys(RFI)),h=dealHand();state={pos,h};
  return `<div class="card"><div class="meta">${tr('rfiMeta',{pos})}</div><div class="hand">${handHTML(h)}</div><div class="row"><button id="f">${tr('fold')}</button><button id="r">${tr('open')}</button></div><div id="fb"></div></div>`;
},bind(){
  const ans=c=>{const {pos,h}=state,inR=RFI_SET[pos].has(h.l),ok=(c==='r')===inR;rec('rfi',ok,{mod:'rfi',pos,hand:h.l,raise:inR});
    $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${tr(ok?'correct':'wrong')}: ${tr('rfiAnswer',{pos,hand:h.l,action:tr(inR?'raise':'fold'),pct:rangePct(RFI_SET[pos]).toFixed(0)})}${gridHTML(RFI_SET[pos],h.l)}</div>${nextButton('nextHand')}`;
    document.querySelectorAll('.row button').forEach(b=>b.disabled=true);bindNext()};$('f').onclick=()=>ans('f');$('r').onclick=()=>ans('r');
}};
mods.push={render(){const pos=pick(Object.keys(PUSH)),stack=pick(Object.keys(PUSH.BTN).map(Number)),h=dealHand();state={pos,stack,h};
  return `<div class="card"><div class="meta">${tr('pushMeta',{pos,stack})}</div><div class="hand">${handHTML(h)}</div><div class="row"><button id="f">${tr('fold')}</button><button id="r">${tr('allin')}</button></div><div id="fb"></div></div>`;
},bind(){const ans=c=>{const {pos,stack,h}=state,lim=PUSH[pos][stack],p=RANKED[h.l],border=Math.abs(p-lim)<=3,push=p<=lim,ok=border||((c==='r')===push);
  rec('push',ok,{mod:'push',pos,stack,hand:h.l,rank:p.toFixed(0),lim,push});
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${tr(ok?'acceptable':'wrong')}: ${tr('pushAnswer',{pos,stack,lim,hand:h.l,rank:p.toFixed(0),decision:border?tr('border'):tr('decision',{action:tr(push?'allin':'fold')})})}</div>${nextButton('nextHand')}`;
  document.querySelectorAll('.row button').forEach(b=>b.disabled=true);bindNext()};$('f').onclick=()=>ans('f');$('r').onclick=()=>ans('r')
}};
let chartMode='all';
const POS_ORDER=['UTG','HJ','CO','BTN'];
const POS_COLOR={UTG:'#2d9d6a',HJ:'#7cc65a',CO:'#d4c245',BTN:'#e08a3c'};
function swatch(color,text){return `<span style="display:inline-block;margin:2px 8px 2px 0"><i style="display:inline-block;width:12px;height:12px;background:${color};border-radius:3px;vertical-align:-1px"></i> ${text}</span>`}
mods.chart={render(){
  const earliest=l=>POS_ORDER.find(p=>RFI_SET[p].has(l)),sb=chartMode==='SB';
  const cells=ALL.map(x=>{const e=sb?(RFI_SET.SB.has(x.l)?'SB':null):earliest(x.l),bg=e==='SB'?'#5aa0e0':e?POS_COLOR[e]:'#22352b';return `<div data-l="${x.l}" style="background:${bg};color:${e?'#10200f':'#5d7666'}">${x.l}</div>`}).join('');
  const toggle=`<div class="row" style="margin:8px 0"><button data-m="all" style="${sb?'':'background:#e0b04a;color:#1a1405'}">${tr('fourPositions')}</button><button data-m="SB" style="${sb?'background:#e0b04a;color:#1a1405':''}">${tr('smallBlind')}</button></div>`;
  const legend=sb?swatch('#5aa0e0',tr('sbRaise'))+swatch('#22352b',tr('fold')):POS_ORDER.map(p=>swatch(POS_COLOR[p],tr('fromPos',{pos:p}))).join('')+swatch('#22352b',tr('foldAll'));
  return `<div class="card"><b>${tr('chartTitle')}</b> (${tr('chartContext')})<p class="meta" style="text-align:left;margin:6px 0">${tr('chartHelp')}</p>${toggle}<div>${legend}</div><div class="grid big" id="cg">${cells}</div><div id="cinfo" class="fb ok" style="margin-top:12px">${tr('chartClick')}</div><p class="meta" style="text-align:left;margin-top:10px">${tr('chartPct')}${[...POS_ORDER,'SB'].map(p=>`${p} ${rangePct(RFI_SET[p]).toFixed(0)}%`).join(' · ')}</p></div>`;
},bind(){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{chartMode=b.dataset.m;show()});$('cg').querySelectorAll('div').forEach(d=>d.onclick=()=>{$('cinfo').innerHTML=`<b>${d.dataset.l}</b>: `+[...POS_ORDER,'SB'].map(p=>`${p} ${RFI_SET[p].has(d.dataset.l)?'✅'+tr('raise'):'❌'+tr('fold')}`).join('　')})}};
mods.terms={render(){
  const terms=TERMS[lang],w=terms.map(t=>4-(tScore[t.id]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(r>w[i]){r-=w[i];i++}
  const rev=Math.random()<0.4,mastered=terms.filter(t=>(tScore[t.id]||0)>=3).length;state={t:terms[i],rev};
  return `<div class="card"><div class="meta">${tr('mastered',{n:mastered,total:terms.length})}</div><p class="q" style="text-align:center;font-size:${rev?17:24}px">${rev?state.t.meaning:state.t.name}</p><button class="go" id="rv" style="width:100%">${tr(rev?'showTerm':'showMeaning')}</button><div id="fb"></div></div>`;
},bind(){const {t,rev}=state;$('rv').onclick=()=>{$('rv').classList.add('hide');$('fb').innerHTML=`<div class="fb ok" style="font-size:17px"><b>${rev?t.name:t.meaning}</b><br>${rev?t.meaning:t.name}</div><div class="row" style="margin-top:10px"><button id="no">${tr('notYet')}</button><button id="yes">${tr('remembered')}</button></div>`;
  const done=ok=>{tScore[t.id]=Math.max(0,Math.min(3,(tScore[t.id]||0)+(ok?1:-2)));try{localStorage.setItem('pokerTerms',JSON.stringify(tScore))}catch(e){}rec('terms',ok,{mod:'terms',termId:t.id});show()};$('yes').onclick=()=>done(true);$('no').onclick=()=>done(false)}
}};
mods.stats={render(){const keys=['terms','math','rfi','push'];const rows=keys.map(k=>{const s=stats[k]||{n:0,c:0};return `<tr><td>${tr(k)}</td><td>${s.n}</td><td>${s.n?(s.c/s.n*100).toFixed(0)+'%':'-'}</td></tr>`}).join('');
  const miss=keys.flatMap(k=>(stats[k]?.miss||[]).slice(0,5).map(m=>`<li>${tr(k)}: ${mistakeText(m)}</li>`)).join('');
  return `<div class="card"><table><tr><th>${tr('module')}</th><th>${tr('attempts')}</th><th>${tr('accuracy')}</th></tr>${rows}</table></div><div class="card"><b>${tr('recentMisses')}</b><ul>${miss||'<li>'+tr('none')+'</li>'}</ul><button class="next" id="clr" style="background:#2c4436;color:#e8f0ea">${tr('clear')}</button></div>`;
},bind(){$('clr').onclick=()=>{stats={};try{localStorage.removeItem('pokerStats')}catch(e){}show()}}};
function setLanguage(next){if(!Object.hasOwn(I18N,next))return;lang=next;try{localStorage.setItem('pokerLang',lang)}catch(e){}show()}
function show(){
  document.documentElement.lang=lang;document.title=tr('title');$('heading').textContent='♠ '+tr('title');$('note').textContent=tr('note');
  $('languages').innerHTML=Object.keys(I18N).map(code=>`<button data-lang="${code}" aria-pressed="${code===lang}">${I18N[code][{'zh-CN':'languageZh',en:'languageEn',ja:'languageJa'}[code]]}</button>`).join(' / ');
  $('languages').querySelectorAll('button').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));
  $('nav').innerHTML=Object.keys(mods).map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">${tr(k)}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;show()});$('view').innerHTML=mods[cur].render();mods[cur].bind();
}
show();
</script>
</body>
</html>
